<style>
:root{
  --ink:#0f0d1a; --plum:#1c1830; --plum2:#2b2547; --paper:#f2ead8; --amber:#ffb000;
  --mute:#a29bbd; --win:#4fe0a0; --lose:#ff6b6b;
  --display:'Unbounded','Arial Black',Impact,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100dvh;display:flex;flex-direction:column;
  background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body::before{ /* projector beam */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(90% 55% at 50% -8%,rgba(255,176,0,.17),transparent 65%);
}
header,main,footer{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,4vw,40px)}
.brand{background:none;border:0;font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:-.01em;padding:6px 0}
#hud{display:flex;gap:18px;font-size:.95rem;color:var(--mute)}
#hud b{font-family:var(--display);color:var(--paper);font-weight:700;margin-left:6px}

main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:8px clamp(16px,4vw,40px) 40px}
footer{padding:20px clamp(16px,4vw,40px) 24px;text-align:center;font-size:.78rem;color:var(--mute)}

h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.03em;overflow-wrap:anywhere}
.fit-lg{font-size:clamp(1.1rem,4.4vw,1.55rem)!important}
.fit-xl{font-size:clamp(.95rem,3.6vw,1.2rem)!important}
.muted{color:var(--mute)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  background:var(--amber);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.95rem;
  padding:17px 28px;min-height:54px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--plum2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--mute)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* home */
.hero{text-align:center;padding:clamp(12px,4vw,40px) 0 28px}
.hero h1{font-weight:900;font-size:clamp(2.7rem,11vw,6rem);}
.hero p{margin:18px auto 0;max-width:34ch;color:var(--mute);font-size:1.05rem}
.tickets{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(20px,4vw,44px);padding:20px 0 10px}
.ticket{
  --y:calc(100% - 66px);
  position:relative;display:flex;flex-direction:column;text-align:left;border:0;padding:0;
  width:min(100%,330px);min-height:360px;color:var(--ink);
  -webkit-mask:radial-gradient(circle 15px at 0 var(--y),#0000 97%,#000) left top/51% 100% no-repeat,
               radial-gradient(circle 15px at 100% var(--y),#0000 97%,#000) right top/51% 100% no-repeat;
          mask:radial-gradient(circle 15px at 0 var(--y),#0000 97%,#000) left top/51% 100% no-repeat,
               radial-gradient(circle 15px at 100% var(--y),#0000 97%,#000) right top/51% 100% no-repeat;
  border-radius:16px;transition:transform .25s ease;
  animation:drop .7s cubic-bezier(.2,.9,.3,1.2) both;
}
.ticket.paper{background:var(--paper)}
.ticket.gold{background:var(--amber)}
.ticket:nth-child(odd){transform:rotate(-2deg)}
.ticket:nth-child(even){transform:rotate(2deg)}
.ticket:nth-child(2){animation-delay:.1s}
.ticket:nth-child(3){animation-delay:.2s}
.ticket:nth-child(4){animation-delay:.3s}
.ticket:nth-child(5){animation-delay:.4s}
.ticket:nth-child(6){animation-delay:.5s}
.ticket:nth-child(7){animation-delay:.6s}
.ticket:nth-child(8){animation-delay:.7s}
.ticket:hover{transform:rotate(0) translateY(-6px)}
@keyframes drop{from{opacity:0;translate:0 -50px}to{opacity:1;translate:0 0}}
.t-main{flex:1;padding:26px 26px 20px;display:flex;flex-direction:column;gap:14px}
.t-main svg{width:64px;height:64px}
.t-main h2{font-size:1.7rem;font-weight:900}
.t-main p{font-size:.98rem;line-height:1.45;opacity:.82}
.t-stub{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;
  border-top:2.5px dashed rgba(15,13,26,.4);font-family:var(--display);font-weight:700;font-size:.85rem}
.t-stub i{font-style:normal;font-family:var(--body);font-weight:500;opacity:.7}

/* panels */
.panel{max-width:520px;margin:clamp(8px,4vw,40px) auto 0}
.panel h2{font-size:clamp(2rem,7vw,3rem);font-weight:900}
.panel > p{margin-top:12px;color:var(--mute)}
.rows{margin:28px 0;border-radius:16px;background:var(--plum);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px}
.row + .row{border-top:1px solid var(--plum2)}
.row small{display:block;color:var(--mute);font-size:.82rem;line-height:1.3;margin-top:2px}
.row strong{font-weight:700}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:12px;border:0;background:var(--plum2);font-size:1.4rem;line-height:1}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{font-family:var(--display);font-weight:900;font-size:1.8rem;min-width:2ch;text-align:center}
.seg{display:flex;background:var(--ink);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 20px;font-family:var(--display);font-weight:700}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:12px}

/* pass / role */
.center{text-align:center}
.pass{max-width:520px;margin:clamp(16px,6vw,60px) auto 0;text-align:center}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--plum2)}
.dots .done{background:var(--amber)}
.dots .now{box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--amber);background:var(--plum2)}
.pass .big{font-size:clamp(3rem,15vw,5.6rem);font-weight:900;margin:8px 0 36px}
.role{max-width:420px;margin:0 auto;text-align:center}
.role img{width:min(62vw,260px);aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:var(--plum)}
.role h2{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;margin:22px 0 4px}
.role .hint{margin:10px 0 26px;color:var(--mute)}
.imp{padding:44px 22px;border-radius:20px;background:var(--lose);color:var(--ink);margin-bottom:26px}
.imp svg{width:70px;height:70px;margin-bottom:12px}
.imp h2{margin:0 0 10px}
.imp p{font-weight:500}

.play{max-width:560px;margin:clamp(16px,6vw,60px) auto 0;text-align:center}
.play h2{font-size:clamp(2rem,8vw,3.4rem);font-weight:900}
.play p{margin:16px auto 30px;color:var(--mute);max-width:38ch}
.play p b{color:var(--paper)}

.names{display:flex;flex-direction:column;gap:6px;margin:18px 0 30px}
.names h3{font-size:clamp(2.6rem,12vw,4.8rem);font-weight:900;color:var(--amber);animation:pop .55s cubic-bezier(.2,1.2,.4,1) both}
.names h3:nth-child(2){animation-delay:.2s}
@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.filmreveal{display:flex;gap:18px;align-items:center;justify-content:center;text-align:left;margin-bottom:28px;animation:pop .5s both}
.filmreveal img{width:min(34vw,150px);aspect-ratio:2/3;object-fit:cover;border-radius:10px}
.filmreveal h3{font-size:1.4rem;font-weight:900}

/* higher / lower */
.hl{max-width:760px;margin:0 auto}
.hl .q{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,3.6vw,1.5rem);margin:6px 0 20px;letter-spacing:-.02em}
.pair{--gap:clamp(12px,3vw,40px);position:relative;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);container-type:inline-size}
.card{background:none;border:0;padding:0;text-align:left;display:block;min-width:0}
.pic{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--plum);transition:box-shadow .25s,transform .2s,filter .3s}
.card:not([disabled]):hover .pic{transform:translateY(-4px)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.pic img.in{opacity:1}
.score{position:absolute;left:0;right:0;bottom:0;padding:44px 10px 12px;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(transparent,rgba(15,13,26,.95));opacity:0;transform:translateY(10px);transition:.35s}
.score b{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,7vw,3rem);line-height:1}
.score span{font-size:.78rem;color:var(--mute);margin-top:4px}
.done .score{opacity:1;transform:none}
.card.win .pic{box-shadow:0 0 0 4px var(--win)}
.card.win .score b{color:var(--win)}
.card.lose .pic{box-shadow:0 0 0 4px var(--lose);filter:saturate(.55) brightness(.85)}
.card[disabled]{cursor:default}
.meta{padding:12px 2px 0}
.meta h3{font-family:var(--body);font-weight:700;font-size:clamp(.95rem,3.4vw,1.2rem);letter-spacing:-.01em;line-height:1.25}
.meta span{color:var(--mute);font-size:.9rem}
.vs{position:absolute;left:50%;top:33%;top:calc((100cqw - var(--gap)) * .375);translate:-50% -50%;
  width:clamp(44px,10cqw,64px);aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--amber);
  display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(.8rem,2.6cqw,1.1rem);
  box-shadow:0 0 0 4px var(--amber);pointer-events:none;z-index:2}
.result{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;margin-top:22px}
.result .msg{font-family:var(--display);font-weight:700;font-size:1.2rem}
.result .msg.ok{color:var(--win)} .result .msg.no{color:var(--lose)}
.over{width:100%;max-width:420px;background:var(--plum);border-radius:16px;padding:22px}
.over .n{font-family:var(--display);font-weight:900;font-size:3rem;line-height:1}

.loading,.error{max-width:420px;margin:18vh auto 0;text-align:center}
.reel{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;border:5px solid var(--plum2);border-top-color:var(--amber);animation:spin .9s linear infinite}
@keyframes spin{to{rotate:360deg}}
.error h2{font-size:1.6rem;margin-bottom:10px}
.error p{color:var(--mute);margin-bottom:22px}

/* shared tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px}
.tile{background:none;border:0;padding:0;text-align:left;display:block;min-width:0}
.tile .pic{border-radius:10px}
.tile:hover .pic{transform:translateY(-3px)}
.tile .meta{padding-top:8px}
.tile .meta h3{font-size:.88rem}
.tile .meta span{font-size:.78rem;display:block;line-height:1.3;margin-top:1px}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.8rem;color:var(--mute);background:var(--plum2)}
.tile.goal .pic{box-shadow:0 0 0 4px var(--amber)}
.tile.goal .meta h3{color:var(--amber)}

/* cast chain */
.chain{max-width:860px;margin:0 auto}
.goal-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;background:var(--plum);border-radius:14px;padding:10px 12px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.goal-bar img{width:46px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;flex:none}
.goal-bar > div{flex:1;min-width:0}
.goal-bar .muted{font-size:.8rem;display:block;line-height:1.3}
.goal-bar h3{font-family:var(--body);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;line-height:1.2}
.goal-bar h3 small{font-weight:400;color:var(--mute);font-size:.85rem;margin-left:6px}
.btn.sm{padding:10px 16px;min-height:44px;font-size:.8rem}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin-bottom:22px;font-size:.88rem}
.chip{background:var(--plum2);border-radius:8px;padding:5px 10px;font-weight:500}
.chip.q{background:none;box-shadow:inset 0 0 0 2px var(--plum2);color:var(--mute)}
.via{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-weight:700}
.arw{width:14px;height:14px;flex:none}
.sub{font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:900;margin:0 0 18px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.loading.small,.error.small{margin:50px auto}
.winlist{display:flex;flex-direction:column;align-items:stretch;max-width:420px;margin:26px auto 30px;text-align:left}
.winrow{display:flex;gap:14px;align-items:center}
.winrow img{width:56px;aspect-ratio:2/3;object-fit:cover;border-radius:8px}
.winrow h3{font-family:var(--body);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.winlink{margin:8px 0 8px 27px;padding:6px 0 6px 22px;border-left:3px solid var(--amber);color:var(--amber);font-weight:700;font-size:.92rem}

/* release year */
.yr{max-width:760px;margin:0 auto;display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
.yr > *{min-width:0}
.yr-film{text-align:center}
.yr-film img{width:min(46vw,230px);aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:var(--plum)}
.yr-film h2{font-size:clamp(1.4rem,5vw,2.1rem);font-weight:900;margin-top:18px}
.yr-ctl{display:flex;flex-direction:column;justify-content:center;gap:18px}
.yr-ctl .q{font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,3.6vw,1.4rem);letter-spacing:-.02em}
.yr-num{width:100%;background:var(--plum);border:2px solid var(--plum2);border-radius:14px;color:var(--paper);
  font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,10vw,3.6rem);text-align:center;padding:14px;min-height:80px;-moz-appearance:textfield}
.yr-num::-webkit-outer-spin-button,.yr-num::-webkit-inner-spin-button{-webkit-appearance:none}
.yr-num:focus{outline:none;border-color:var(--amber)}
.yr-range{width:100%;accent-color:var(--amber);height:34px}
.yr-err{color:var(--lose);min-height:1.4em;font-size:.9rem}
.yr-res .msg{font-family:var(--display);font-weight:900;font-size:1.8rem;margin-bottom:6px}
.yr-res .msg.ok{color:var(--win)} .yr-res .msg.mid{color:var(--amber)} .yr-res .msg.no{color:var(--lose)}
.yr-res p{color:var(--mute);margin-bottom:18px}
.yr-res p b{color:var(--paper)}
.score-big{font-family:var(--display);font-weight:900;font-size:clamp(4rem,20vw,7rem);line-height:1;color:var(--amber);margin:10px 0 4px}
.review{max-width:480px;margin:26px auto 30px;border-radius:16px;background:var(--plum);overflow:hidden;text-align:left}
.review .row{padding:12px 16px;gap:12px}
.review img{width:34px;aspect-ratio:2/3;object-fit:cover;border-radius:4px;flex:none}
.review .t{flex:1;min-width:0;font-weight:700;font-size:.95rem;line-height:1.25}
.review .t small{display:block;font-weight:400;color:var(--mute)}
.review .d{font-family:var(--display);font-weight:900;font-size:1.1rem}
@media (min-width:720px){
  .yr{grid-template-columns:240px minmax(0,1fr);align-items:center;gap:48px}
  .yr-film{text-align:left}
}

/* timeline sort */
.sort{max-width:820px;margin:0 auto}
.sort .q{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,3.6vw,1.5rem);letter-spacing:-.02em;margin:6px 0 14px}
.legend{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.85rem;margin-bottom:16px}
.legend i{flex:1;border-top:2px dashed var(--plum2)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.sorttile{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-width:0}
.sorttile .pic{border-radius:10px}
.sorttile.sel .pic{box-shadow:0 0 0 4px var(--amber);transform:translateY(-4px) scale(1.03)}
.sorttile.win .pic{box-shadow:0 0 0 4px var(--win)}
.sorttile.lose .pic{box-shadow:0 0 0 4px var(--lose)}
.sorttile .num{position:absolute;left:6px;top:6px;z-index:2;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:rgba(15,13,26,.85);font-family:var(--display);font-weight:700;font-size:.72rem;display:grid;place-items:center}
.sorttile .flag{position:absolute;right:6px;top:6px;z-index:2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--ink);font-size:.9rem}
.flag.win{background:var(--win)} .flag.lose{background:var(--lose)}
.sorttile .t{font-size:.78rem;font-weight:700;line-height:1.25;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.sorttile .yl{font-family:var(--display);font-weight:900;font-size:1.05rem;color:var(--amber);margin-top:2px}
.sortmsg{font-size:.98rem;color:var(--paper);min-height:1.5em}
.sortend h2{font-family:var(--display);font-weight:900;font-size:1.6rem;margin-bottom:6px}
.sortend p{color:var(--mute);margin-bottom:6px}
@media (min-width:640px){.board{grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 14px}}

/* cast call */
.cg{max-width:820px;margin:0 auto}
.cg .q,.odd .q{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,3.6vw,1.5rem);letter-spacing:-.02em;margin:6px 0 20px}
.castrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;margin-bottom:24px}
.castrow .tile{pointer-events:none}
.tile.slot .pic{background:var(--plum);box-shadow:inset 0 0 0 2px var(--plum2)}
.tile.slot .ph{background:none;color:var(--plum2);font-size:2.4rem}
.tile.fresh .pic{animation:pop .5s cubic-bezier(.2,1.2,.4,1) both}
.cg-q{width:100%;min-height:58px;background:var(--plum);border:2px solid var(--plum2);border-radius:14px;color:var(--paper);font:inherit;font-size:1.05rem;padding:0 18px}
.cg-q:focus{outline:none;border-color:var(--amber)}
.cg-q::placeholder{color:var(--mute)}
.cg-res{display:flex;flex-direction:column;margin-top:8px;border-radius:14px;overflow:hidden;background:var(--plum)}
.cg-item{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:8px 14px;min-height:64px;width:100%}
.cg-item + .cg-item{border-top:1px solid var(--plum2)}
.cg-item:hover{background:var(--plum2)}
.cg-item img,.cg-item .nop{width:36px;aspect-ratio:2/3;object-fit:cover;border-radius:4px;background:var(--plum2);flex:none}
.cg-item span{font-weight:700;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.cg-item small{display:block;color:var(--mute);font-weight:400}
.wrongs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.wrongs .chip{background:none;box-shadow:inset 0 0 0 2px var(--lose);color:var(--lose)}
.cg-msg{margin:16px 0;min-height:1.5em;text-align:center}
.cg-end{text-align:center}
.cg-end h2{font-family:var(--display);font-weight:900;font-size:1.7rem;margin-bottom:6px}
.cg-end > p{color:var(--mute)}
@media (min-width:640px){.castrow{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* odd one out */
.odd{max-width:820px;margin:0 auto}
.cat{text-align:center;margin:4px 0 22px;padding:18px;border-radius:16px;background:var(--plum)}
.cat span{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.12em}
.cat h2{font-size:clamp(1.5rem,6vw,2.4rem);font-weight:900;color:var(--amber);margin-top:6px}
.cat.hid h2{color:var(--plum2)}
.board.eight{grid-template-columns:repeat(2,minmax(0,1fr))}
.sorttile.dead{pointer-events:none}
.sorttile.dead.lose .pic{filter:saturate(.4) brightness(.65)}
@media (min-width:520px){.board.eight{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* true or flop */
.tf{max-width:640px;margin:0 auto}
.tf-card{background:var(--paper);color:var(--ink);border-radius:18px;padding:26px 24px 30px;margin:6px 0 20px;position:relative}
.tf-card::after{content:"";position:absolute;left:18px;right:18px;bottom:14px;border-top:2.5px dashed rgba(15,13,26,.3)}
.tf-n{font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.tf-q{font-family:var(--body);font-weight:700;font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.25;letter-spacing:-.015em;margin:12px 0 14px;overflow-wrap:anywhere}
.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfb{min-height:68px;font-size:1.1rem;color:var(--ink)}
.tfb.t{background:var(--win)} .tfb.f{background:var(--lose)}
.tfb.dim{opacity:.35}

<body>
<header>
  <button class="brand" data-a="home" aria-label="Reel Deal home">Reel Deal</button>
  <div id="hud" aria-live="polite"></div>
</header>
<main id="app"></main>
<footer>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>

<script>
/* ---------- TMDB ---------- */
const TMDB_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI4YmQwMjk1MDVlYmM2OTk4NjQwNmRjNGYxZmNlOWJhMCIsIm5iZiI6MTc3ODMzNzM2OS40NDksInN1YiI6IjY5ZmY0NjU5YjViMmM5YzQzNjMxNmYzYSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.rxnhffAVh8-7DdufZHeJyjYys95mpgMEg7ywZwe90S0";
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

async function tmdb(path, params = {}) {
  const url = new URL(API + path);
  Object.entries({ language: "en-GB", ...params }).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, { headers: { accept: "application/json", Authorization: "Bearer " + TMDB_TOKEN } });
  if (!res.ok) { const e = new Error("TMDB " + res.status); e.status = res.status; throw e; }
  return res.json();
}
const cache = {};
function once(key, loader) {
  if (!cache[key]) cache[key] = loader().catch(e => { delete cache[key]; throw e; });
  return cache[key];
}
const dedupe = list => [...new Map(list.map(m => [m.id, m])).values()];
const isEn = m => m.original_language === "en";

const loadFilms = () => once("films", async () => {
  const reqs = [];
  for (let p = 1; p <= 4; p++) reqs.push(tmdb("/movie/popular", { page: p }));
  for (let p = 1; p <= 2; p++) reqs.push(tmdb("/movie/top_rated", { page: p }));
  const all = dedupe((await Promise.all(reqs)).flatMap(r => r.results)).filter(isEn);
  let good = all.filter(m => m.poster_path && m.release_date && m.vote_count >= 1000);
  if (good.length < 15) good = all.filter(m => m.poster_path && m.release_date);
  return good;
});
const loadTrending = () => once("trending", async () => {
  const res = await Promise.all([1, 2, 3, 4, 5].map(p => tmdb("/trending/movie/week", { page: p })));
  const all = dedupe(res.flatMap(r => r.results)).filter(isEn);
  let good = all.filter(m => m.poster_path && m.vote_count >= 50 && m.vote_average > 0);
  if (good.length < 10) good = all.filter(m => m.poster_path && m.vote_average > 0);
  return good;
});

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const hud = document.getElementById("hud");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const year = m => (m.release_date || "").slice(0, 4) || "n/a";
const rand = n => Math.floor(Math.random() * n);
const pick = arr => arr[rand(arr.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function view(html, { keepHud = false } = {}) {
  app.innerHTML = html;
  if (!keepHud) hud.innerHTML = "";
  window.scrollTo(0, 0);
}
const loading = msg => view(`<div class="loading"><div class="reel"></div><p class="muted">${esc(msg)}</p></div>`);
function fail(err, retryAction) {
  const auth = err && (err.status === 401 || err.status === 403);
  view(`<div class="error"><h2>Couldn't load films</h2>
    <p>${auth ? "TMDB rejected the access token. Check that it is correct and still active." : "Check your internet connection and try again."}</p>
    <div class="stack"><button class="btn" data-a="${retryAction}">Try again</button><button class="btn ghost" data-a="home">Back to start</button></div></div>`);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- home ---------- */
function home() {

      <span class="t-main">

        <h2>The Imposter</h2>
        <p>Everyone gets the same film except one or two of you. Say a word each, then work out who's bluffing.</p>
      </span>
      <span class="t-stub">Pass and play <i>3 to 12 players</i></span>
    </button>
    <button class="ticket gold" data-a="go-hl">
      <span class="t-main">
        <svg viewBox="0 0 64 64" fill="none" stroke="#0f0d1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 6l7 14 15 2-11 11 3 16-14-8-14 8 3-16L10 22l15-2z"/></svg>
        <h2>Higher or Lower</h2>
        <p>Two films picked from across the decades. Which one has the better TMDB rating? One slip and the streak is over.</p>

    <button class="ticket paper" data-a="go-sort">
      <span class="t-main">
        <svg viewBox="0 0 64 64" fill="none" stroke="#0f0d1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="34" width="12" height="22" rx="2"/><rect x="26" y="22" width="12" height="34" rx="2"/><rect x="44" y="8" width="12" height="48" rx="2"/></svg>
        <h2>Timeline</h2>

      </span>

    </button>
    <button class="ticket gold" data-a="go-cast">
      <span class="t-main">
        <svg viewBox="0 0 64 64" fill="none" stroke="#0f0d1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="32" cy="22" r="11"/><path d="M10 58c2-14 10-20 22-20s20 6 22 20"/></svg>
        <h2>Cast Call</h2>
        <p>We name one actor and you guess the film. Wrong? We reveal another, up to five.</p>
      </span>
      <span class="t-stub">Solo <i>5 clues</i></span>
    </button>
    <button class="ticket gold" data-a="go-odd">
      <span class="t-main">
        <svg viewBox="0 0 64 64" fill="none" stroke="#0f0d1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="18" r="8"/><circle cx="48" cy="18" r="8"/><circle cx="16" cy="46" r="8"/><rect x="40" y="38" width="16" height="16" rx="2"/></svg>
        <h2>Odd One Out</h2>
        <p>Eight films, one doesn't belong. Spot it in three guesses on easy or five on hard.</p>
      </span>

    </button>
    <button class="ticket paper" data-a="go-tf">
      <span class="t-main">
        <svg viewBox="0 0 64 64" fill="none" stroke="#0f0d1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 34l11 11 20-24"/><path d="M42 40l14 14M56 40L42 54"/></svg>
        <h2>True or Flop</h2>
        <p>Movie trivia, five statements a round. Decide if each one is true or false.</p>

}

/* ---------- imposter ---------- */
const I = { players: 5, imposters: 1, film: null, imps: [], idx: 0, seen: new Set() };

function imposterSetup() {
  if (I.players < 5 && I.imposters === 2) I.imposters = 1;
  const two = I.players >= 5;
  view(`
  <section class="panel">
    <h2>The Imposter</h2>
    <p>Set up the table, then pass the device round so everyone sees their role in secret.</p>
    <div class="rows">
      <div class="row">
        <div><strong>Players</strong><small>At least 3</small></div>
        <div class="stepper">
          <button data-a="p-minus" aria-label="Fewer players" ${I.players <= 3 ? "disabled" : ""}>−</button>
          <output aria-live="polite">${I.players}</output>
          <button data-a="p-plus" aria-label="More players" ${I.players >= 12 ? "disabled" : ""}>+</button>
        </div>
      </div>
      <div class="row">
        <div><strong>Imposters</strong><small>${two ? "Choose how many" : "Two imposters need 5+ players"}</small></div>
        <div class="seg" role="group" aria-label="Number of imposters">
          <button data-a="imp-1" aria-pressed="${I.imposters === 1}">1</button>
          <button data-a="imp-2" aria-pressed="${I.imposters === 2}" ${two ? "" : "disabled"}>2</button>
        </div>
      </div>
    </div>
    <div class="stack">
      <button class="btn wide" data-a="deal">Deal the roles</button>
      <button class="btn ghost wide" data-a="home">Back</button>
    </div>
  </section>`);
}

async function deal() {
  loading("Picking a film…");
  try {
    const films = await loadFilms();
    let fresh = films.filter(m => !I.seen.has(m.id));
    if (!fresh.length) { I.seen.clear(); fresh = films; }
    I.film = pick(fresh);
    I.seen.add(I.film.id);
    I.imps = shuffle([...Array(I.players).keys()]).slice(0, I.imposters).sort((a, b) => a - b);
    I.idx = 0;
    // warm the poster so it appears instantly
    const im = new Image(); im.src = IMG + I.film.poster_path;
    passScreen();
  } catch (e) { fail(e, "deal"); }
}

function dots() {
  return `<div class="dots" aria-hidden="true">${[...Array(I.players).keys()].map(i =>
    `<span class="${i < I.idx ? "done" : i === I.idx ? "now" : ""}"></span>`).join("")}</div>`;
}
function passScreen() {
  view(`
  <section class="pass">
    ${dots()}
    <p class="muted">Pass the device to</p>
    <h2 class="big">Player ${I.idx + 1}</h2>
    <button class="btn wide" data-a="reveal-role">I'm Player ${I.idx + 1}. Show my role</button>
  </section>`);
}
function roleScreen() {
  const last = I.idx === I.players - 1;
  const btn = `<button class="btn wide" data-a="next-player">${last ? "Hide and start the round" : "Hide and pass on"}</button>`;
  if (I.imps.includes(I.idx)) {
    view(`
    <section class="role">
      <div class="imp">
        <svg viewBox="0 0 64 64" fill="none" stroke="#0f0d1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 28c0-14 10-20 22-20s22 6 22 20c0 12-6 28-22 28S10 40 10 28z"/><path d="M20 28h8M36 28h8"/><path d="M26 42c4 3 8 3 12 0"/></svg>
        <h2>You're the imposter</h2>
        <p>You don't get the film. Listen to the others and blend in.${I.imposters === 2 ? " There's one more imposter, but you won't know who." : ""}</p>
      </div>
      ${btn}
    </section>`);
  } else {
    view(`
    <section class="role">
      <img src="${IMG + I.film.poster_path}" alt="Poster for ${esc(I.film.title)}">
      <h2 class="${fit(I.film.title)}">${esc(I.film.title)}</h2>
      <span class="muted">${year(I.film)}</span>
      <p class="hint">Remember it, but don't say the title out loud.</p>
      ${btn}
    </section>`);
  }
}
function playScreen() {
  const start = rand(I.players) + 1;
  view(`
  <section class="play">
    <h2>Round on</h2>
    <p>Go round the table. Each player says one word that relates to the film. <b>Player ${start}</b> starts. Go round again if you want more clues, then vote.</p>
    <button class="btn wide" data-a="reveal-imposter">Reveal the imposter${I.imposters > 1 ? "s" : ""}</button>
  </section>`);
}
function revealScreen(showFilm = false) {
  view(`
  <section class="play">
    <p style="margin:0 auto">The ${I.imposters > 1 ? "imposters were" : "imposter was"}</p>
    <div class="names">${I.imps.map(i => `<h3>Player ${i + 1}</h3>`).join("")}</div>
    ${showFilm
      ? `<div class="filmreveal"><img src="${IMG + I.film.poster_path}" alt=""><div><p class="muted" style="margin:0">The film was</p><h3 class="${fit(I.film.title)}">${esc(I.film.title)}</h3><span class="muted">${year(I.film)}</span></div></div>`
      : `<div class="stack" style="margin-bottom:12px"><button class="btn wide" data-a="show-film">Show the film</button></div>`}
    <div class="stack">
      <button class="btn ${showFilm ? "" : "ghost"} wide" data-a="again">New round</button>
      <button class="btn ghost wide" data-a="imposter-setup">Change players</button>
    </div>
  </section>`);
}

/* ---------- higher / lower ---------- */
const loadHLPool = () => once("hlpool", async () => {
  const [trending, films, groups] = await Promise.all([loadTrending(), loadFilms(), loadYearFilms()]);
  const all = dedupe([...trending, ...films, ...Object.values(groups).flat()]);
  const good = all.filter(m => m.poster_path && isEn(m) && m.vote_count >= 100 && m.vote_average > 0);
  return good.length >= 20 ? good : all.filter(m => m.poster_path && m.vote_average > 0);
});
const H = { mode: "all", pool: [], used: new Set(), a: null, b: null, streak: 0, best: 0, locked: false };
const hlBestKey = () => "df-best-" + H.mode;
const loadModernPool = () => once("modernpool", async () => {
  const [trending, all] = await Promise.all([loadTrending(), loadHLPool()]);
  const cutoff = new Date().getFullYear() - 9;
  const recent = all.filter(m => parseInt(year(m), 10) >= cutoff);
  return dedupe([...trending, ...recent]);
});
function hlSetup() {
  const best = store.get(hlBestKey(), 0);
  view(`
  <section class="panel">
    <h2>Higher or Lower</h2>
    <p>Two films, one question: which has the higher TMDB rating? One wrong pick ends your streak.</p>
    <div class="rows">
      <div class="row">
        <div><strong>Films from</strong><small>${H.mode === "all" ? "Every era, from the 1940s to now." : "This week's trending films and recent hits."}${best ? " Best streak: " + best + "." : ""}</small></div>
        <div class="seg" role="group" aria-label="Era">
          <button data-a="hl-all" aria-pressed="${H.mode === "all"}">All</button>
          <button data-a="hl-modern" aria-pressed="${H.mode === "modern"}">Modern</button>
        </div>
      </div>
    </div>
    <div class="stack"><button class="btn wide" data-a="hl-start">Start</button><button class="btn ghost wide" data-a="home">Back</button></div>
  </section>`);
}

async function startHL() {
  loading("Picking films…");
  try {
    H.pool = H.mode === "modern" ? await loadModernPool() : await loadHLPool();
    H.used.clear(); H.streak = 0; H.best = store.get(hlBestKey(), 0);
    nextPair(true);
  } catch (e) { fail(e, "hl-start"); }
}
function drawPair() {
  let avail = H.pool.filter(m => !H.used.has(m.id));
  if (avail.length < 2) { H.used.clear(); avail = H.pool; }
  for (let t = 0; t < 60; t++) {
    const a = pick(avail), b = pick(avail);
    if (a.id !== b.id && a.vote_average.toFixed(1) !== b.vote_average.toFixed(1)) return [a, b];
  }
  const a = pick(avail); const b = H.pool.find(m => m.id !== a.id && m.vote_average.toFixed(1) !== a.vote_average.toFixed(1));
  return [a, b];
}
function updateHud() {
  hud.innerHTML = `<span>Streak<b>${H.streak}</b></span><span>Best<b>${H.best}</b></span>`;
}
function filmCard(m, i) {
  return `<button class="card" data-a="guess" data-i="${i}" aria-label="${esc(m.title)}, ${year(m)}">
    <div class="pic"><img src="${IMG + m.poster_path}" alt="Poster for ${esc(m.title)}" onload="this.classList.add('in')">
      <div class="score"><b data-score="${m.vote_average}">0.0</b></div></div>
    <div class="meta"><h3>${esc(m.title)}</h3><span>${year(m)}</span></div>
  </button>`;
}
function nextPair(first = false) {
  [H.a, H.b] = drawPair();
  H.used.add(H.a.id); H.used.add(H.b.id);
  H.locked = false;
  view(`
  <section class="hl">
    <p class="q">Which film has the higher rating?</p>
    <div class="pair" id="pair">
      ${filmCard(H.a, 0)}${filmCard(H.b, 1)}
      <div class="vs" aria-hidden="true">VS</div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
  </section>`, { keepHud: true });
  updateHud();
}
function countUp(el, target, ms = 800) {
  const t0 = performance.now();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = target.toFixed(1); return; }
  const tick = now => {
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = (target * (1 - Math.pow(1 - p, 3))).toFixed(1);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function guess(i) {
  if (H.locked) return;
  H.locked = true;
  const films = [H.a, H.b];
  const winner = films[0].vote_average >= films[1].vote_average ? 0 : 1;
  const correct = i === winner;
  const cards = [...document.querySelectorAll("#pair .card")];
  cards.forEach((c, k) => {
    c.disabled = true;
    c.classList.add("done", k === winner ? "win" : "lose");
    const b = c.querySelector("[data-score]");
    countUp(b, parseFloat(b.dataset.score));
  });
  const res = document.getElementById("result");
  if (correct) {
    H.streak++;
    if (H.streak > H.best) { H.best = H.streak; store.set(hlBestKey(), H.best); }
    updateHud();
    res.innerHTML = `<div class="msg ok">Correct</div><button class="btn" data-a="next-pair">Next pair</button>`;
    res.querySelector("button").focus({ preventScroll: true });
  } else {
    const final = H.streak;
    res.innerHTML = `<div class="over"><div class="msg no">Wrong pick</div>
      <p class="muted" style="margin:10px 0 4px">Your streak ended at</p><div class="n">${final}</div>
      <p class="muted" style="margin:6px 0 18px">Best: ${H.best}</p>
      <div class="stack"><button class="btn wide" data-a="hl-again">Play again</button><button class="btn ghost wide" data-a="hl-setup">Change era</button><button class="btn ghost wide" data-a="home">Back to start</button></div></div>`;
    H.streak = 0; updateHud();
    res.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

/* ---------- cast chain ---------- */
const PROF = "https://image.tmdb.org/t/p/w185";
const POS = "https://image.tmdb.org/t/p/w342";
const ARW = '<svg class="arw" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const C = { start: null, target: null, targetCast: [], hops: [], cur: null, stage: "actors", actor: null, cast: [], shown: [], loading: false, err: null, retry: null, won: false, tok: 0 };
const castCache = new Map(), filmoCache = new Map();
function cached(map, key, loader) {
  if (!map.has(key)) map.set(key, loader().catch(e => { map.delete(key); throw e; }));
  return map.get(key);
}
const getCast = id => cached(castCache, id, async () => (await tmdb(`/movie/${id}/credits`)).cast.filter(c => c.name).slice(0, 20));
const getFilmography = id => cached(filmoCache, id, async () => (await tmdb(`/person/${id}/movie_credits`)).cast);
const fit = t => (t.length > 34 ? "fit-xl" : t.length > 20 ? "fit-lg" : "");
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("");

function cleanFilms(list) {
  const seen = new Set();
  return list
    .filter(m => m.poster_path && isEn(m) && !(m.genre_ids || []).includes(99)
      && !/\b(self|himself|herself|themselves|archive footage)\b/i.test(m.character || "")
      && !/uncredited/i.test(m.character || "")
      && !seen.has(m.id) && seen.add(m.id))

/* ---------- release year ---------- */
const Y = { n: 5, films: [], i: 0, total: 0, log: [], answered: false };
const loadYearFilms = () => once("yearfilms", async () => {
  const decades = [1940, 1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];
  const reqs = decades.flatMap(d => [1, 2].map(page => tmdb("/discover/movie", {
    with_original_language: "en", sort_by: "vote_count.desc", "vote_count.gte": 300,
    "primary_release_date.gte": `${d}-01-01`, "primary_release_date.lte": `${d + 9}-12-31`, page
  }).then(r => ({ d, res: r.results }))));
  const groups = {};
  (await Promise.all(reqs)).forEach(({ d, res }) => {
    (groups[d] = groups[d] || []).push(...res.filter(m => m.poster_path && m.release_date && isEn(m)));
  });
  Object.keys(groups).forEach(d => { groups[d] = dedupe(groups[d]); if (groups[d].length < 4) delete groups[d]; });
  if (!Object.keys(groups).length) throw new Error("No films");
  return groups;
});
function pickYearFilms(groups, n, distinct = false) {
  const decs = Object.keys(groups), chosen = [], used = new Set(), years = new Set();
  const ok = m => !used.has(m.id) && !(distinct && years.has(year(m)));
  let bag = [];
  while (chosen.length < n) {
    if (!bag.length) bag = shuffle(decs);
    const d = bag.pop();
    const avail = groups[d].filter(ok);
    if (!avail.length) { if (!decs.some(k => groups[k].some(ok))) break; continue; }
    const m = pick(avail); used.add(m.id); years.add(year(m)); chosen.push(m);
  }
  return shuffle(chosen);
}
function yearSetup() {
  const best = store.get("df-year-best-" + Y.n, null);

}
async function startYear() {

}

  const max = new Date().getFullYear();
  view(`

const T = { films: [], order: [], sel: null, left: 5, verdict: {}, lastSig: "", over: false, won: false, right: 0, drag: null, msg: "" };
async function startSort() {
  loading("Shuffling posters…");
  try {

      msg: "Tap two posters to swap them, or drag one onto another." });

  } catch (e) { fail(e, "go-sort"); }
}
const sortSig = () => T.order.map(m => m.id).join(",");
const sortedYears = () => T.films.map(m => parseInt(year(m), 10)).sort((a, b) => a - b);
function sortScreen() {
  view(`
  <section class="sort">
    <p class="q">Sort the films from oldest to newest</p>
    <div class="legend"><span>Oldest</span><i></i><span>Newest</span></div>
    <div class="board" id="board"></div>
    <div class="result" id="sort-ctl" aria-live="polite"></div>
  </section>`, { keepHud: true });
  renderSort();
}
function renderSort() {
  hud.innerHTML = `<span>Checks left<b>${T.left}</b></span>`;
  document.getElementById("board").innerHTML = T.order.map((m, i) => {
    const v = T.verdict[m.id];
    const mark = T.over ? (T.won ? "win" : "") : (v && v.pos === i ? (v.ok ? "win" : "lose") : "");
    return `<div class="sorttile ${T.sel === i ? "sel" : ""} ${mark}" role="button" tabindex="0" draggable="${!T.over}" data-a="sort-tap" data-i="${i}" title="${esc(m.title)}" aria-label="Position ${i + 1}: ${esc(m.title)}${T.sel === i ? ", selected" : ""}">
      <div class="pic"><img class="in" draggable="false" src="${POS + m.poster_path}" alt="">
        <span class="num">${i + 1}</span>${mark ? `<span class="flag ${mark}" aria-label="${mark === "win" ? "Correct place" : "Wrong place"}">${mark === "win" ? "✓" : "✕"}</span>` : ""}</div>
      <div class="t">${esc(m.title)}</div>${T.over ? `<div class="yl">${year(m)}</div>` : ""}
    </div>`;
  }).join("");
  const ctl = document.getElementById("sort-ctl");
  if (T.over) {
    const used = 5 - T.left;
    ctl.innerHTML = `<div class="sortend"><h2>${T.won ? "Perfect order" : "Out of checks"}</h2>
      <p>${T.won ? `You got it in ${used} ${used === 1 ? "check" : "checks"}.` : `Your last check had ${T.right} of 10 in the right place. This is the true order.`}</p></div>
      <div class="stack" style="width:100%;max-width:420px"><button class="btn wide" data-a="go-sort">Play again</button><button class="btn ghost wide" data-a="home">Back to start</button></div>`;
  } else {
    const same = sortSig() === T.lastSig;
    ctl.innerHTML = `<p class="sortmsg">${esc(T.msg)}</p>
      <button class="btn wide" style="max-width:420px" data-a="sort-check" ${same ? "disabled" : ""}>Check order (${T.left} left)</button>`;
  }
}
function sortSwap(a, b) {
  if (T.over || a === b) return;
  [T.order[a], T.order[b]] = [T.order[b], T.order[a]];
  T.sel = null; renderSort();
}
function sortTap(i) {
  if (T.over) return;
  if (T.sel === null) T.sel = i;
  else if (T.sel === i) T.sel = null;
  else return sortSwap(T.sel, i);
  renderSort();
}
function sortCheck() {
  if (T.over || T.left <= 0) return;
  const sig = sortSig();
  if (sig === T.lastSig) return;
  T.lastSig = sig; T.left--; T.sel = null; T.verdict = {};
  const ys = sortedYears(); let right = 0;
  T.order.forEach((m, i) => { const ok = parseInt(year(m), 10) === ys[i]; if (ok) right++; T.verdict[m.id] = { pos: i, ok }; });
  T.right = right;
  if (right === T.order.length || T.left === 0) {
    T.over = true; T.won = right === T.order.length;
    T.order = [...T.films].sort((a, b) => parseInt(year(a), 10) - parseInt(year(b), 10));
  } else {
    T.msg = `${right} of 10 in the right place. ${T.left} ${T.left === 1 ? "check" : "checks"} left.`;
  }
  renderSort();
}

const GENRES = [{ id: 28, n: "Action" }, { id: 16, n: "Animated" }, { id: 35, n: "Comedy" }, { id: 27, n: "Horror" }, { id: 878, n: "Sci-fi" }, { id: 10749, n: "Romance" }, { id: 14, n: "Fantasy" }, { id: 80, n: "Crime" }, { id: 10752, n: "War" }, { id: 53, n: "Thriller" }, { id: 10751, n: "Family" }];
const personCache = new Map(), pcredCache = new Map();
const personId = (name, dept) => cached(personCache, name, async () => {
  const r = (await tmdb("/search/person", { query: name })).results;
  const p = r.find(x => x.known_for_department === dept) || r[0];
  if (!p) throw new Error("person");
  return p.id;
});
const getPersonCredits = id => cached(pcredCache, id, () => tmdb(`/person/${id}/movie_credits`));
const goodFilm = m => m.poster_path && isEn(m) && m.release_date && !(m.genre_ids || []).includes(99);
const byVotes = (a, b) => b.vote_count - a.vote_count;

async function buildCategory() {
  const kind = pick(["decade", "year", "director", "actor", "genre"]);
  if (kind === "decade") {
    const groups = await loadYearFilms();
    const d = +pick(Object.keys(groups).filter(k => +k >= 1970));
    const x = d >= 2000 ? d + "s" : String(d).slice(2) + "s";
    return { label: `${x} movie`, matches: groups[d].slice(0, 25),
      oddPool: Object.entries(groups).filter(([k]) => +k !== d).flatMap(([, v]) => v) };
  }
  if (kind === "year") {
    const y = 1980 + rand(45);
    const [r, groups] = await Promise.all([
      tmdb("/discover/movie", { with_original_language: "en", sort_by: "vote_count.desc", primary_release_year: y, "vote_count.gte": 300 }),
      loadYearFilms()]);
    return { label: `Released in ${y}`, matches: r.results.filter(goodFilm).slice(0, 20),
      oddPool: Object.values(groups).flat().filter(m => parseInt(year(m), 10) !== y) };
  }
  if (kind === "director" || kind === "actor") {
    const isDir = kind === "director";
    const name = pick(isDir ? DIRECTORS : ACTORS);
    const cr = await getPersonCredits(await personId(name, isDir ? "Directing" : "Acting"));
    const allIds = new Set([...cr.cast, ...cr.crew].map(m => m.id));
    const matches = isDir
      ? dedupe(cr.crew.filter(c => c.job === "Director")).filter(m => goodFilm(m) && m.vote_count >= 500).sort(byVotes).slice(0, 20)
      : cleanFilms(cr.cast).filter(m => m.vote_count >= 500).slice(0, 20);
    return { label: isDir ? `Directed by ${name}` : `Starring ${name}`, matches, oddPool: (await loadFilms()).filter(m => !allIds.has(m.id)) };
  }
  const g = pick(GENRES);
  const res = await Promise.all([1, 2].map(page => tmdb("/discover/movie", { with_original_language: "en", with_genres: g.id, sort_by: "vote_count.desc", "vote_count.gte": 1000, page })));
  return { label: `${g.n} movie`, matches: res.flatMap(r => r.results).filter(goodFilm).slice(0, 30),
    oddPool: (await loadFilms()).filter(m => !(m.genre_ids || []).includes(g.id)) };
}
async function buildOdd() {
  let lastErr;
  for (let t = 0; t < 8; t++) {
    try {
      const c = await buildCategory();
      if (c.matches.length < 7) continue;
      const matches = shuffle(c.matches.slice(0, 20)).slice(0, 7);
      const ids = new Set(matches.map(m => m.id));
      const odd = pick(c.oddPool.filter(m => m.poster_path && !ids.has(m.id)));
      if (!odd) continue;
      return { label: c.label, tiles: shuffle([...matches, odd]), oddId: odd.id };
    } catch (e) { lastErr = e; if (e.status === 401) throw e; }
  }
  throw lastErr || new Error("No round");
}
const O = { mode: "easy", tiles: [], oddId: 0, label: "", left: 3, sel: null, wrong: new Set(), over: false, won: false, msg: "" };

}
async function startOdd() {
  loading("Setting the lineup…");
  try {
    const r = await buildOdd();
    Object.assign(O, { tiles: r.tiles, oddId: r.oddId, label: r.label, left: O.mode === "easy" ? 3 : 5, sel: null, wrong: new Set(), over: false, won: false,
      msg: O.mode === "easy" ? "Tap the film that doesn't fit the category." : "Look for what seven of them share, then tap the film that doesn't." });
    view(`
    <section class="odd">
      <div class="cat" id="odd-cat"></div>
      <p class="q">Which one is the odd one out?</p>
      <div class="board eight" id="odd-board"></div>
      <div class="result" id="odd-ctl" aria-live="polite"></div>
    </section>`, { keepHud: true });
    renderOdd();
  } catch (e) { fail(e, "odd-start"); }
}
function renderOdd() {
  hud.innerHTML = `<span>Guesses left<b>${O.left}</b></span>`;
  const hard = O.mode === "hard";
  const cat = document.getElementById("odd-cat");
  cat.className = "cat" + (hard && !O.over ? " hid" : "");
  cat.innerHTML = hard && !O.over ? `<span>Category</span><h2>Hidden</h2>` : `<span>${hard ? "The category was" : "Category"}</span><h2>${esc(O.label)}</h2>`;
  document.getElementById("odd-board").innerHTML = O.tiles.map(m => {
    const isOdd = m.id === O.oddId, dead = O.wrong.has(m.id);
    const mark = O.over && isOdd ? "win" : dead ? "lose" : "";
    return `<div class="sorttile ${O.sel === m.id ? "sel" : ""} ${mark} ${dead || O.over ? "dead" : ""}" role="button" tabindex="0" data-a="odd-tap" data-id="${m.id}" aria-label="${esc(m.title)}${O.sel === m.id ? ", selected" : ""}">
      <div class="pic"><img class="in" draggable="false" src="${POS + m.poster_path}" alt="">${mark ? `<span class="flag ${mark}">${mark === "win" ? "✓" : "✕"}</span>` : ""}</div>
      <div class="t">${esc(m.title)}</div>${O.over ? `<div class="yl">${year(m)}</div>` : ""}</div>`;
  }).join("");
  const ctl = document.getElementById("odd-ctl");
  if (O.over) {
    const odd = O.tiles.find(m => m.id === O.oddId), used = O.wrong.size + 1;
    ctl.innerHTML = `<div class="sortend"><h2>${O.won ? "Found it" : "Out of guesses"}</h2>
      <p>${O.won ? `You spotted it in ${used} ${used === 1 ? "guess" : "guesses"}. ` : ""}The odd one out was ${esc(odd.title)}.</p></div>
      <div class="stack" style="width:100%;max-width:420px"><button class="btn wide" data-a="odd-start">Play again</button><button class="btn ghost wide" data-a="odd-setup">Change mode</button><button class="btn ghost wide" data-a="home">Back to start</button></div>`;
  } else {
    ctl.innerHTML = `<p class="sortmsg">${esc(O.msg)}</p><button class="btn wide" style="max-width:420px" data-a="odd-lock" ${O.sel === null ? "disabled" : ""}>Lock in guess</button>`;
  }
}
function oddTap(id) {
  if (O.over || O.wrong.has(id)) return;
  O.sel = O.sel === id ? null : id; renderOdd();
}
function oddLock() {
  if (O.over || O.sel === null) return;
  if (O.sel === O.oddId) { O.over = true; O.won = true; }
  else {
    O.wrong.add(O.sel); O.left--; O.sel = null;
    if (O.left <= 0) { O.over = true; O.won = false; }
    else O.msg = `Not that one. ${O.left} ${O.left === 1 ? "guess" : "guesses"} left.`;
  }
  renderOdd();
}

const TF = { qs: [], i: 0, score: 0, log: [], answered: false, seen: new Set() };
function startTF() {
  let avail = TF_BANK.map((_, i) => i).filter(i => !TF.seen.has(i));
  if (avail.length < 5) { TF.seen.clear(); avail = TF_BANK.map((_, i) => i); }
  TF.qs = shuffle(avail).slice(0, 5).map(i => { TF.seen.add(i); return TF_BANK[i]; });
  TF.i = 0; TF.score = 0; TF.log = [];
  tfQuestion();
}
function tfHud() { hud.innerHTML = `<span>Statement<b>${Math.min(TF.i + 1, 5)}/5</b></span><span>Score<b>${TF.score}</b></span>`; }
function tfQuestion() {
  TF.answered = false;
  const q = TF.qs[TF.i];
  view(`
  <section class="tf">
    <div class="tf-card"><span class="tf-n">Statement ${TF.i + 1} of 5</span><h2 class="tf-q">${esc(q.q)}</h2></div>
    <div class="tf-btns">
      <button class="btn tfb t" data-a="tf-true" id="tf-t">True</button>
      <button class="btn tfb f" data-a="tf-false" id="tf-f">False</button>
    </div>
    <div class="tf-res" id="tf-res" aria-live="polite"></div>
  </section>`, { keepHud: true });
  tfHud();
}
function tfAnswer(choice) {
  if (TF.answered) return;
  TF.answered = true;
  const q = TF.qs[TF.i], ok = choice === q.a;
  if (ok) TF.score++;
  TF.log.push({ q, choice, ok });
  tfHud();
  const t = document.getElementById("tf-t"), f = document.getElementById("tf-f");
  [t, f].forEach(b => b.disabled = true);
  (q.a ? t : f).classList.add("right");
  (q.a ? f : t).classList.add("dim");
  const last = TF.i === 4;
  const res = document.getElementById("tf-res");
  res.innerHTML = `<div class="msg ${ok ? "ok" : "no"}">${ok ? "Correct" : "Not quite"}</div>
    <p>It's <b style="color:var(--paper)">${q.a ? "true" : "false"}</b>. ${esc(q.w)}</p>
    <button class="btn wide" data-a="tf-next" style="max-width:420px">${last ? "See my score" : "Next statement"}</button>`;
  res.querySelector("button").focus({ preventScroll: true });
}
function tfEnd() {
  hud.innerHTML = "";
  const s = TF.score;
  const verdict = s === 5 ? "Perfect round. Proper film buff." : s === 4 ? "Nearly flawless." : s === 3 ? "A solid effort." : s === 2 ? "Could do with more movie nights." : "Time for a marathon.";
  view(`
  <section class="play">
    <p style="margin:0 auto">You scored</p>
    <div class="score-big">${s}/5</div>
    <h2 style="font-size:1.3rem">${verdict}</h2>
    <div class="review">${TF.log.map(r => `<div class="row"><div class="t">${esc(r.q.q)}<small>${r.q.a ? "True" : "False"}. You said ${r.choice ? "true" : "false"}.</small></div><div class="d ${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "✕"}</div></div>`).join("")}</div>
    <div class="stack"><button class="btn wide" data-a="go-tf">Play again</button><button class="btn ghost wide" data-a="home">Back to start</button></div>
  </section>`);
}
